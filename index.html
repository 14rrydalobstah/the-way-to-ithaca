   else{types=[3,6].includes(level)?['city']:[];let n=this.roll(2,'候选数量','map')+1;while(types.length<n){let pool=Object.keys(MAP.weights).filter(k=>!types.includes(k));types.push(this.pickWeighted(pool,k=>MAP.weights[k],'map'))}}
   const nodes=types.map((type,i)=>{let sea=this.roll(2,'海陆地形','map')===1,days=type==='elite'?(i===0?1:3):type==='battle'&&sea?this.roll(2,'航程','map'):1;
    if(i===0)days=1;let node={id:`L${level}-${i}`,level,type,sea,days,sleep:days===2||days===3?[1]:[],name:MAP.names[type],complete:false};
    if(['city','island','temple','boss'].includes(type))node.sea=type==='boss';

 connectMap(layers){
  // A monotone spine keeps all nodes reachable without crossing every branch.
  for(let row=0;row<layers.length;row++)for(let i=0;i<layers[row].length;i++){
   let n=layers[row][i];n.next=[];n.lane=i;n.name=({city:['白帆城邦','石港城邦','灯塔城邦'],island:['橄榄荒岛','月湾荒岛','松林荒岛'],temple:['海岸神庙','断柱神庙','山岬神庙'],event:n.sea?['漂流海域','礁石水道','薄雾海湾']:['林间岔路','旧日海岸','荒野山岬'],battle:n.sea?['波纹海域','暗潮海湾','碎礁外海']:['林缘小径','石坡海岸','荒丘古道'],elite:n.sea?['深水海峡','远海险滩']:['荒崖古道','山岬遗址'],boss:['归乡海峡']}[n.type]||['未知地点'])[i%3];
   if(row===layers.length-1)continue;let next=layers[row+1],anchor=Math.round(i*(next.length-1)/Math.max(1,layers[row].length-1));n.next.push(next[anchor].id);

 }
 routeInfo(n){let shore=['city','island','temple'].includes(n.type)||!n.sea;return{name:n.days>1?'外海航路':n.sea?'沿岸航路':'靠岸航路',arrival:shore?`最短 ${n.days} 天抵达${n.name}并靠岸`:`最短 ${n.days} 天抵达${n.name}；这里不能扎营，需沿后续航路寻找岸地`,clue:n.type==='city'?'远处可见灯塔与商船，港内有旅馆和集市。':n.type==='island'?'岸上有树林与淡水迹象，可以尝试采集、扎营。':n.type==='temple'?'海岬上露出石柱，或许仍有人留下祭品。':n.type==='elite'?(n.sea?'深水中传来沉闷回响，船身随浪震动。':'古道上散落巨大的足印，四周异常寂静。'):n.type==='boss'?'故乡就在海峡另一端，水面下浮现庞大阴影。':n.type==='event'?'沿途景象尚不清楚，可能发现补给，也可能需要绕行。':n.sea?'水面出现不寻常的波纹，远处偶尔有背鳍掠过。':'岸边留着凌乱足迹，林间似乎有动静。',sleep:n.sleep.length?`第 ${n.sleep.join('、')} 天可以在船上睡眠；不能恢复战技`:'途中没有睡眠安排',food:n.days*this.foodNeed()}}

 startRoute(id){let err=this.nodeReason(id);if(err)throw Error(err);let n=this.s.map[this.s.layer].find(n=>n.id===id);this.s.currentNode=id;this.s.route={node:id,day:0,extraDone:false,retry:null};this.s.phase='voyage';this.s.event=null;this.s.notice=`已承诺前往${n.name}：${n.days} 日。不能中途换线或靠岸。`;this.log(this.s.notice)}
 advance(){if(this.s.phase!=='voyage'||!this.s.route)throw Error('不在航行阶段');let p=this.s.route,n=this.currentNode();if(p.retry){const retry=p.retry;p.retry=null;this.encounter(retry,true);return}if(p.day<n.days){if(!this.payDay(n.name+'航程'))return;p.day++;this.s.notice=`${n.name}：已航行 ${p.day}/${n.days} 日。`;if(n.sleep.includes(p.day)){this.sleep(false);this.s.notice+='已完成海上睡眠，战技不恢复。'}else this.log('这一段没有睡眠安排。');if(n.extraEnemies&&p.day===2&&!p.extraDone){this.encounter('extra');return}if(p.day<n.days)return}this.arrive()}

 }

 completeBattleExit(ctx,win){if(ctx==='expedition'){if(win)this.resolveEncounter(this.s.lastBattlePart||'main',true);else{this.s.route.retry=this.s.lastBattlePart||'main';this.s.phase='voyage';this.s.notice='仍在已承诺航线；继续前进重新检定，不再收取原航程费用。'}return}if(ctx==='camp'){this.s.phase='island';return}return super.completeBattleExit(ctx,win)}

 assign(index,hero){if(this.s.phase==='battle'||this.s.phase==='failed')throw Error('战后才能分配');let entry=this.s.bag[index],h=this.s.party[hero];if(!entry||!h||h.dead)throw Error('物品或角色无效');let item=ITEMS[entry.key];if(item.type==='move')h.moves.push(entry.key);else if(item.type==='boon')h.boons.push(entry.key);else if(entry.key==='echo'){if(h.echo)throw Error('已经装备回声猎弓');h.echo=true;h.charge=entry.charge??1}else if(entry.key==='insight'){if(this.s.insight)throw Error('已有待使用的洞察');this.s.insight=true}else{if(h.trinket)this.s.bag.push({key:h.trinket,source:'更换装备'});h.trinket=entry.key}this.s.bag.splice(index,1);let record=this.s.growthLog.findLast(x=>x.key===entry.key&&x.owner==='暂存');if(record)record.owner=h.name;this.log(`${h.name}现在获得${item.name}：${item.desc}`,'good')}
 makeCity(){let pool=Object.keys(ITEMS).filter(k=>!GROWTH[k]||!this.s.collected.includes(k)),goods=[];while(pool.length&&goods.length<3){let key=this.pickWeighted(pool,k=>RARITY[ITEMS[k].rarity].weight,'reward');goods.push({key,sold:false});pool.splice(pool.indexOf(key),1)}return{food:18,bandages:2,revives:2,goods,recruited:false}}

function load(confirmed=false){try{let raw=localStorage.getItem(SAVE_KEY);if(!raw)return toast('尚无存档');if(!confirmed){confirmChange('读取存档将替换当前页面进度。',()=>load(true));return;}game=Game.restore(JSON.parse(raw));latestLogStart=latestLogEnd=0;$('#seed').value=game.s.seed;render();toast('存档已恢复。')}catch(e){toast('读取失败：'+e.message)}}
async function exportLog(){const contents=JSON.stringify({format:VERSION,savedAt:new Date().toISOString(),state:game.s},null,2);try{toast(await RecordExport.save(contents))}catch(e){toast(e.name==='AbortError'?'已取消导出，记录仍保留在当前游戏中。':'导出失败：'+e.message)}}
function renderCrew(){let s=game.s;$('#crew').innerHTML=s.party.map(h=>`<button class="crew-card ${s.selected===h.id?'selected':''}" data-cmd="select" data-args='{"id":${h.id}}'><div class="name"><span class="portrait">${['△','◇','○'][h.id]}</span>${h.name}</div><div class="bar"><i style="width:${h.hp/h.max*100}%"></i></div><div class="stats"><span class="${h.hp<=3?'bad':''}">生命 ${h.hp}/${h.max}</span><span>护盾 ${h.shield}</span></div><div class="stats"><span>战技 ${'●'.repeat(h.sp)}${'○'.repeat(3-h.sp)}</span><span>${s.phase==='battle'?'行动 '+h.ap+'/'+(s.battle.surprise?2:3):'疲劳 '+h.fatigue}</span></div><div class="stats"><span>${game.weapon(h).name}</span><span>${h.echo?'充能 '+h.charge+'/1':''}</span></div>${h.trinket?`<div class="subline good">${ITEMS[h.trinket].name}</div>`:''}${h.boons.length?`<div class="subline good">常驻：${h.boons.map(k=>ITEMS[k].name).join('、')}</div>`:''}${h.dead?'<div class="bad">已死亡</div>':h.out?'<div class="good">已撤离</div>':h.hp===0?`<div class="bad">倒地 · 退出本战 · 再跨日 ${h.downDays} 次将永久死亡</div>`:''}${h.carry!==null?'<div class="bad">正在搬运队友</div>':''}</button>`).join('');let h=game.actor(),outside=!['battle','failed','home'].includes(s.phase);$('#equipment').innerHTML=outside?`<div class="equipment"><b>${h.name} · 个人整备</b><div class="stack">${button('持近战','equip',{weapon:'melee'},'',h.dead)}${button('持弓','equip',{weapon:'bow'},'',h.dead)}</div><div style="margin-top:8px">${button('使用绷带 +'+(4+game.op('heal'))+' 生命','healOutside',{},'',h.dead||h.hp===0||h.hp===h.max||s.bandages<1)}</div>${h.echo||h.trinket?`<div class="inventory-line">分配给 <select id="transferTo">${s.party.filter(x=>x.id!==h.id&&!x.dead).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><div class="stack">${h.echo?'<button data-transfer="echo">转交回声猎弓</button>':''}${h.trinket?'<button data-transfer="trinket">交换饰品</button>':''}</div></div>`:''}${s.insight?'<div class="good">携带：雅典娜的洞察</div>':''}</div>`:''}
function scenic(label){return `<div class="sea-art"><div class="sun"></div><div class="sail"></div><div class="ship"></div><div class="map-label">${label}</div><div class="sea-caption">AEGEAN SEA · 归乡之路</div></div>`}
let secondTarget=null;
function intentText(e){let b=game.s.battle;if(!e.intent)return '';let t=game.s.party[e.intent.target];return ['charge','lunge'].includes(e.intent.type)?`突进攻击 → ${t?.name||'目标失效'}：接近 ${e.intent.type==='charge'?'2～3':'1'} 档${e.slow?'，牵制 −1':''}${e.shock?'，麻痹 −1':''}，进入射程立即攻击 · 命中 +${e.hit}${e.cover?' −3':''}${e.shock?' −3':''}，伤害 d6+${e.add+(e.enrage&&e.hp<=e.max/2?2:0)}${e.press?' −2':''}`:e.intent.type==='rush'?`冲刺：接近 2～3 档${e.slow?'，牵制 −1':''}，不攻击`:e.intent.type==='pursue'?`追船：接近 1 档${e.slow?'，牵制 −1':''}，本轮不攻击`:e.intent.type==='move'?`接近${e.slow?'（牵制中）':''}：不攻击`:e.intent.type==='sweep'?`扫击全队 · 命中 +${e.hit}${e.cover?' −3':''}，伤害 d6${e.press?' −2':''}`:`攻击 ${t?.name||'目标失效'} · 命中 +${e.hit}${e.cover?' −3':''}${e.shock?' −3（麻痹）':''}，伤害 d6${(e.add+(e.enrage&&e.hp<=e.max/2?2:0))?'+'+(e.add+(e.enrage&&e.hp<=e.max/2?2:0)):''}${e.press?' −2':''}`}
function renderBattle(){let s=game.s,b=s.battle,h=game.actor(),enemies=b.enemies.filter(e=>e.hp>0),sea=b.type==='sea';$('#heading').innerHTML=`<div class="eyebrow">${sea?'SEA ENCOUNTER / 海上遭遇':'LAND ENCOUNTER / 陆地遭遇'}</div><h1>${b.surprise?'突袭阶段':'第 '+b.round+' 回合'} · ${sea?'掌舵，或迎战':'站位与撤离'}</h1>${b.surprise?'<div class="phase-banner"><b>偷袭成功 · 突袭阶段</b><p>每人只有 2 点行动，敌人暂不主动行动。结束突袭后，海陆均进入每人 3 点行动的普通回合。</p></div>':'<div class="phase-banner"><b>普通战斗阶段 · 每人 3 点行动</b><p>海战与陆战行动点一致。移动、换武器和治疗会消耗剩余行动。</p></div>'}<p>先选择角色和目标，再行动。${sea?'操船消耗 3 点行动；先后顺序会改变射击距离。':'离开敌人所在区域会引发借机攻击；每人分别移动。'}</p>`;
 let lanes=sea?[0,1,2,3,4]:[0,1,2,3];$('#scene').innerHTML=`<div class="battlefield">${enemies.map(e=>`<div class="intent"><strong>${b.surprise?'突袭期间不行动 · 后续威胁':'敌方下一步行动'} · ${e.name}</strong><br> · 防护 ${e.ac-(e.exposed?2:0)}${e.exposed?'（破甲 −2）':''} → ${intentText(e)}${e.trait?'<small> · '+esc(e.trait)+'</small>':''}${e.reaction?' · 可借机攻击':''}${e.bleed?' · 流血 '+e.bleed+' 层／剩 '+e.bleedTicks+' 次':''}${e.shock?' · 麻痹：本轮命中 −3／移动 −1':''}</div>`).join('')}<div class="lanes ${sea?'':'land-lanes'}">${lanes.map(n=>`<div class="lane"><div class="lane-label">${sea?['0 接触','1 近距','2 中距','3 远距','4 脱离'][n]:AREAS[n]}</div>${sea&&n===0?'<div class="unit ally"><span class="shape">▰</span>远征船</div>':''}${!sea?s.party.filter(x=>!x.dead&&!x.out&&x.pos===n).map(x=>`<button class="unit ally ${h.id===x.id?'active':''}" data-cmd="select" data-args='{"id":${x.id}}'><span class="shape">${x.hp===0?'▽':'△'}</span>${x.name}${x.hp===0?' · 倒地':''}</button>`).join(''):''}${enemies.filter(e=>(sea?e.dist:e.pos)===n).map(e=>`<button class="unit ${s.target===e.id?'active':''}" data-cmd="target" data-args='{"id":"${e.id}"}'><span class="shape">${e.kind==='beast'?'◆':'■'}</span>${e.name}<br>${e.hp}/${e.max}</button>`).join('')}</div>`).join('')}</div></div>`;
 $('#choices').innerHTML='';let target=game.enemy(s.target);if(!target&&enemies.length){s.target=enemies[0].id;target=enemies[0]}if(!s.party.some(x=>x.id===ally&&game.alive(x)))ally=h.id;let p=target?game.preview(h,target,{insight:useInsight}):null;const defs=[['attack','普通攻击','2 行动 · 一次攻击机会'],['strong','强力攻击','3 行动 +1 战技 · 额外 +d6'],['aim','瞄准','2 行动 · 本轮不能攻击；下次主动攻击命中 +3，保留至使用，不叠加'],['defend','自我防御','2 行动 · 普通 1d6／大成功 2d6／大失败 0 护盾'],['switch','切换武器','1 行动 · '+(h.weapon==='bow'?'改用近战':'改用弓箭')],['cover','掩护射击','2 行动 +1 战技 · 半伤，敌命中 −3'],...(h.id===0?[['press','压制打击','2 行动 +1 战技 · 半伤，敌伤害 −2']]:h.id===1?[['slow','牵制射击','2 行动 +1 战技 · 半伤，移动 −1']]:sea?[['safe','稳舵脱离','3 行动 +1 战技 · 无借机后撤']]:[]),...(sea?[['shipBack','操船后撤','3 行动 · 贴船时触发借机'],['shipForward','操船前进','3 行动 · 接近一档'],['escape','尝试脱离','3 行动 · 距离 4，检定 ≥6']]:[['moveBack','向撤离点移动',`${h.carry!==null?2:1} 行动 · 向左一片区域`],['moveForward','向林地移动',`${h.carry!==null?2:1} 行动 · 向右一片区域`],['retreat','离开战场','1 行动 · 在无敌人的 A 区']]),['heal','绷带治疗','1 行动 +1 绷带 · 恢复 '+(4+game.op('heal'))+' 生命（可治疗自己）']];
 if(!enemies.some(e=>e.id===secondTarget))secondTarget=null;let options={target:s.target,ally,echo:useEcho,insight:useInsight,second:secondTarget||s.target};$('#actions').innerHTML=`<div class="action-head"><h2>${h.name}的行动</h2>${h.aim?'<span class="pill">已瞄准：下次主动攻击 +3 命中 · 保留至使用</span>':''}<span class="pill">剩余 ${h.ap}/${b.surprise?2:3} 行动 · 战技 ${h.sp}/3 ${h.aimUsed?'· 本轮已瞄准，不能攻击':h.attackUsed?'· 已攻击':''}</span></div><div class="target-select"><label>攻击目标 <select id="enemyTarget">${enemies.map(e=>`<option value="${e.id}" ${e.id===s.target?'selected':''}>${e.name} · ${e.hp} 生命</option>`).join('')}</select></label><label>连珠第二箭 <select id="secondTarget"><option value="">跟随主目标（集中射击）</option>${enemies.map(e=>`<option value="${e.id}" ${secondTarget===e.id?'selected':''}>${e.name}</option>`).join('')}</select></label><label>绷带治疗目标 <select id="allyTarget">${s.party.filter(x=>game.alive(x)).map(x=>`<option value="${x.id}" ${x.id===ally?'selected':''}>${x.name} · ${x.hp}/${x.max} 生命${x.id===h.id?'（自己）':''}</option>`).join('')}</select></label></div>${p?`<div class="notice subline">${game.weapon(h).name} → ${target.name}：命中需 d20 ${p.mod>=0?'+':'−'} ${Math.abs(p.mod)} ≥ ${p.ac??target.ac}（自然 1 必失，20 暴击）；基础攻击命中 <b>${(p.chance*100).toFixed(1)}%</b>${p.dis?' · 劣势：'+(game.distance(h,target)===3?'远距离或贴身威胁':'敌人贴身')+'，掷两次 d20 取较低值':''}${p.adv?' · 优势：掷两次 d20 取较高值':''}${p.aimAdvantage?' · 神射之赐已准备':''}${p.aimBonusDice?' · 蓄势之赐：命中后伤害额外 +1d6':''}${useInsight&&game.disadvantage(h,target)?' · 洞察优势与距离劣势抵消，只掷一次':''}；普通命中伤害 ${1+p.add}～${6+p.add}。自然 20 暴击。射程与行动限制以下方按钮为准。</div>`:''}<div class="target-select">${h.echo&&h.weapon==='bow'?`<label><input id="echoToggle" type="checkbox" ${useEcho?'checked':''} ${h.charge<1?'disabled':''}> 本次攻击消耗回声充能 +d6（${h.charge}/1）</label>`:''}${s.insight?`<label><input id="insightToggle" type="checkbox" ${useInsight?'checked':''}> 消耗洞察，获得命中优势</label>`:''}</div><p class="healing-hint">团队绷带 ${s.bandages} 份 · 治疗对象：${s.party[ally]?.name||'请选择'}。切换行动角色会默认治疗自己；治疗队友请在上方指定，陆战需要同区。</p><h3>基础动作与职业战技</h3><div class="action-grid">${defs.map(([a,label,detail])=>{let err=game.reason(a,options);return button(`${label}<small>${err||detail}</small>`,'action',{action:a,...options},'',!!err,err||detail)}).join('')}</div><h3>旅途学会的招式 · 全部可用</h3><div class="action-grid">${h.moves.map(k=>{let err=game.reason(k,options);return button(ITEMS[k].name+`<small>${err?'不可用：'+esc(err)+'<br>':''}${esc(ITEMS[k].desc)}</small>`,'action',{action:k,...options},'',!!err,(err?err+'；':'')+ITEMS[k].desc)}).join('')||'<p class="muted">还未学习秘籍。在旅途中获得并分配后显示于此。</p>'}</div><div class="end-turn"><span>攻击／瞄准／防御各 2 行动，不能同轮兼得 · 本角色回合结束最多保留 ${game.boon(h,'retain')} 护盾 · 操船本轮${b.moved?'已用':'可用'}</span>${button(b.surprise?'结束突袭':'结束我方回合','end',{},'primary')}</div>`}
function renderRoutes(){let s=game.s,keys=s.phase==='city'?['strait','deep']:s.phase==='island'?['ferry']:['island','coast','ocean'];let desc={strait:'2 个偏安全遭遇段，深水海兽会扫击全队。一次海上睡眠；终点须击败守门巨兽。',deep:'4 个偏危险遭遇段，第 2 日连续遭遇；可能遇到高防护甲壳海兽。一次海上睡眠；终点须击败守门巨兽。进入航线获得一件额外成长奖励。',island:'登陆后可能战斗。可以采集与扎营，恢复战技；停留会吸引危险。',coast:'2 个偏安全遭遇段，途中一次海上睡眠。战技不会恢复。',ocean:'5 个偏危险遭遇段，第 2 日连续遭遇。两次海上睡眠。抵达奖励更高。',ferry:'一日到达城邦，途中一个偏安全遭遇段，没有自动睡眠。'};return `<div class="route-grid">${keys.map((k,i)=>{let r=ROUTES[k],cost=r.days*game.live().length;return `<article class="route-card"><div class="route-icon">${['⌂','≈','◇'][i]}</div><h3>${r.name}</h3><div class="pills"><span class="pill">${r.days} 日</span><span class="pill">至少 ${cost} 份口粮</span></div><p>${desc[k]}</p>${button(s.food<cost?'口粮不足':'选择此路线','route',{key:k},i===1?'primary':'',s.food<cost)}</article>`}).join('')}</div>`}
function recoveryPanel(){let s=game.s,injured=s.party.filter(h=>!h.dead&&h.hp===0);if(!injured.length||s.phase==='failed')return '';return `<div class="notice"><b>战后救治 · 复苏药 ${s.revives} 份</b><p>1 份恢复 30% 最大生命（向上取整），不恢复战技；普通睡眠和绷带不能复活。期限按跨日次数结算，点击整备按钮不会消耗时间。</p>${injured.map(h=>`<p class="bad">${h.name}：再经过 ${h.downDays} 次跨日结算将永久死亡。</p>${button('救治 '+h.name+' · 恢复 '+Math.ceil(h.max*0.3)+' 生命','revive',{ally:h.id},'primary',s.revives<1,s.revives<1?'需要复苏药，可在城邦购买':'消耗 1 份复苏药')}`).join('')}</div>`}
function renderWorld(){let s=game.s,phase=s.phase;$('#actions').innerHTML='';$('#scene').innerHTML=scenic(phase==='city'?'▥ 城邦灯塔':phase==='island'?'△ 无名荒岛':'≈ 爱琴海');let title={map:'归乡之前，先选一条路',voyage:'已启航 · 无法中途换线',scout:'雾中的先机',island:'无名荒岛 · 停留也是选择',city:'城邦补给 · 准备后段航程',home:'抵达归乡港 · 试玩完成',reward:'旅途馈赠 · 选择你的成长',failed:'远征止步于此',testEnd:'测试场景结束',chainRest:'第一场结束 · 海上过夜',aftermath:'战后整备 · 撤退待结算'}[phase]||phase;$('#heading').innerHTML=`<div class="eyebrow">ODYSSEY / ${s.mode==='journey'?'远征旅程':'独立测试'}</div><h1>${title}</h1><p>${esc(s.notice)}</p>`;let html='';if(phase==='map')html=renderRoutes()+`<div class="notice"><b>开始前</b><p>初始 18 份口粮可供三人 6 天。选择角色可整备起手武器。每次航路战斗胜利后获得一次成长奖励（奖励池耗尽为止）。</p></div>`;
 if(phase==='voyage'){let p=s.route,r=ROUTES[p.key];html=`<div class="progress">${Array.from({length:r.days},(_,i)=>`<i class="${i<p.day?'done':''}"></i>`).join('')}</div><h2>${r.name}</h2><div class="pills"><span class="pill">进度 ${p.day}/${r.days} 日</span><span class="pill">当前日遭遇 ${p.slot}/${r.slots[p.day]}</span><span class="pill">${p.paid?'本日口粮已结算':'下一步开始新的一日'}</span></div><p>只有抵达节点才能重新选路。睡眠由航程安排，不能中途上岸。</p>${button(p.paid&&p.slot>=r.slots[p.day]?'结束本日航行':'继续前进 / 遭遇检定','advance',{},'primary')}`}
 if(phase==='scout')html=`<div class="notice">选择角色来组织偷袭。偷袭：d6 +${game.actor().id===1?2:0} − 疲劳 ${game.actor().fatigue} ≥ 5；成功获得突袭阶段，失败正常接战。绕行：d6 +${game.alive(s.party[2])?3:1} − 疲劳 ${game.alive(s.party[2])?s.party[2].fatigue:0} ≥ 6；失败进入战斗。</div><div class="stack">${button('尝试绕开','scout',{choice:'bypass'})}${button('主动偷袭','scout',{choice:'ambush'},'primary')}${button('直接迎战','scout',{choice:'fight'})}</div>`;
 if(phase==='island'){let threshold=Math.min(s.island.stays+1,4);html=`<div class="pills"><span class="pill">剩余采集点 ${s.island.gathers}/2</span><span class="pill">下一次停留危险 ${(threshold/6*100).toFixed(0)}%</span></div><p>每天消耗 ${game.live().length} 份口粮。采集：d6 +2 − 猎人疲劳 ${s.party[1].fatigue} ≥ 6，成功 +6 份，失败 +0。野外危险：d6 骰面 ≤ 危险阈值时遇敌。扎营恢复战技，但可能被打断。</p><div class="target-select"><label>扎营守夜者 <select id="guard"><option value="-1">无人守夜</option>${s.party.filter(h=>game.alive(h)).map(h=>`<option value="${h.id}">${h.name}（自身不恢复）</option>`).join('')}</select></label></div><div class="stack">${button('采集一天','gather',{},'',s.island.gathers<=0||!game.alive(s.party[1]))}<button id="campButton" class="primary">扎营睡眠一天</button></div><div class="note">守夜使危险阈值降低 1。连续第二夜守夜起增加疲劳。城邦住宿不需要守夜。</div>${renderRoutes()}`}

$('#help').onclick=()=>{$('#dialogContent').innerHTML=`<div class="eyebrow">FIELD GUIDE / 试玩说明</div><h1>带着队伍，走完一段归途</h1><ol><li>在左侧选择角色，战外可免费选择武器、分配背包奖励。选择路线后不能随时换路或上岸。</li><li>战斗中每人每轮 3 点行动（突袭阶段 2 点）、一次攻击机会。攻击、瞄准、防御和控制战技各 2 点；移动、换武器、绷带治疗各 1 点；强力攻击和操船各 3 点。先选角色与目标，再点击行动；置灰按钮会解释原因。</li><li>海战操船带动全队；陆战每人各自移动。弓在距离 1～2 正常攻击，距离 0 或 3 有劣势；近战只在距离 0 可用。</li><li>强力攻击、掩护射击和专属战技各消耗 1 战技点，未命中也消耗。普通攻击、瞄准、防御不消耗战技点。战技点只能通过陆地完整睡眠恢复。海上睡眠只为清醒队员恢复 1 生命与已装备回声猎弓充能。</li><li>瞄准与主动攻击同轮二选一；消耗 2 行动，下次主动攻击命中 +3，跨回合与战斗保留，不叠加，命中或未命中都消耗。剩余 1 行动可换武器、移动或治疗，借机攻击不消耗瞄准。防御先掷 d20：自然 1 无护盾，2～19 再掷 1d6，自然 20 掷 2d6；护盾只持续本轮。</li><li>生命归零后退出本场战斗；战后用 1 份复苏药恢复 30% 最大生命（向上取整）。开局 1 份，城邦可花 6 银币购买，库存 2。再经过 2 次跨日结算仍未救治则永久死亡。普通睡眠和绷带不能复活；全队倒地立即失败。陆战撤退本版自动带回倒地者。</li><li>海战距离 4 可尝试脱离；成功消耗额外一天口粮，继续原路线并重新判定遭遇，不算通过。</li><li>此版共 9 层，开局生成随机地图、只显示未来两层。普通战斗直接掉落，神庙与精英提供三选一；秘籍和神赐先进入背包，经营物品自动生效。第三、六层有城邦机会，第九层击败巨兽归乡。</li><li>种子相同且操作相同会得到相同骰面。保存保留完整状态；导出包含操作和骰子记录。所有数值都是测试默认值。</li></ol><p>实现范围与规则差异记录于 prototype/试玩说明.md。此版本使用几何占位画面，尚不含完整剧情、正式美术或联机。</p>`;$('#dialog').showModal()};$('#closeDialog').onclick=()=>$('#dialog').close();

function renderRouteForecastCard(n,from=null){let info=game.routeInfo(n);return `<article class="route-card route-forecast"><span class="eyebrow">第 ${n.level} 层 · ${n.sea?'海上':'陆地／靠岸'}${n.fogged?' · 海雾遮蔽':''}</span><h3>${esc(n.name)}</h3><p>${esc(info.arrival)}</p><p><b>航路迹象：</b>${esc(info.risk||info.clue)}</p><p><b>可能收获：</b>${esc(info.reward||'尚不可辨')}</p><p>${n.days} 天 · 约需 ${info.food} 口粮 · ${esc(info.sleep)}</p>${from?`<p class="subline">经${esc(from.name)}抵达：合计最短 ${from.days+n.days} 天、约 ${(from.days+n.days)*game.foodNeed()} 口粮，按当前队伍估算。</p>`:''}</article>`;}

function renderVictorySummary(){let r=game.s.lastVictory;if(!r)return '';return `<section class="victory-summary" aria-label="本次收获"><span class="eyebrow">${r.source==='航路发现'?'探索结束':'战斗结束'} · 本次所得</span><h2>${esc(r.source)}</h2><div class="pills"><span class="pill">银币合计 +${r.gold}</span><span class="pill">口粮合计 +${r.food}</span></div><p>${esc(r.note)}</p><div class="route-grid">${r.items.map(k=>'<article class="route-card">'+itemCard(k)+'</article>').join('')}</div>${r.choicesPending?'<p class="good">本场还有一份三选一奖励待领取。</p>':''}</section>`;}
let routePreviewId=null;
function renderLongMap(readOnly=false){
 const s=game.s,rows=game.fullMap(),ids=game.accessibleIds(),height=1600,xy=(level,i,count)=>({x:(i+1)*100/(count+1),y:height-100-level*150}),path=s.map.flat().filter(n=>n.complete).sort((a,b)=>a.level-b.level);
 if(game.currentNode()&&!game.currentNode().complete)path.push(game.currentNode());
 const lines=[],nodes=[],origin=xy(0,0,1),pathEdge=(a,b)=>path.some((n,i)=>n.id===b&&(i===0?a==='start':path[i-1].id===a));
 rows[0].forEach((n,i)=>{let p=xy(1,i,rows[0].length);lines.push(`<line x1="50%" y1="${origin.y-22}" x2="${p.x}%" y2="${p.y+22}" class="${pathEdge('start',n.id)?'travelled-edge':'future-edge'}"/>`)});
 // Old saves may contain a journey taken before fixed connections existed.
 for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i];if(b.level!==a.level+1||a.next.includes(b.id))continue;let ar=rows[a.level-1],br=rows[b.level-1];if(ar[0].hidden||br[0].hidden)continue;let ap=xy(a.level,ar.findIndex(n=>n.id===a.id),ar.length),bp=xy(b.level,br.findIndex(n=>n.id===b.id),br.length);lines.push(`<line x1="${ap.x}%" y1="${ap.y-22}" x2="${bp.x}%" y2="${bp.y+22}" class="travelled-edge"/>`)}
 for(let row=0;row<rows.length;row++){

  rows[row].forEach((n,i)=>{let p=xy(n.level,i,rows[row].length),current=n.id===s.currentNode,next=n.level===s.layer+1&&ids.includes(n.id),previewable=!readOnly&&next&&['map','city','island'].includes(s.phase),icon={city:'▥',island:'△',temple:'⌂',event:'?',battle:'≈',passage:n.sea?'≈':'△',elite:'◆',boss:'♜'}[n.type];
   nodes.push(`<div class="chart-node ${n.complete?'visited-node':''} ${current?'current-node':''} ${next?'reachable':''} ${n.id===routePreviewId?'previewed':''}" style="left:${p.x}%;top:${p.y}px" data-map-node="${n.id}">${previewable?`<button data-inspect-route="${n.id}" aria-label="查看${esc(n.name)}航路">${icon}</button>`:`<span class="node-symbol">${icon}</span>`}<b>${esc(n.name)}</b><small>${current?(s.route?'正在前往':'当前位置'):n.complete?'✓ 已经过':n.level<=s.layer?'未选择':next?'可沿连线前往':'后续地点'}</small></div>`);
   if(rows[row+1]&&!rows[row+1][0].hidden)n.next.forEach(id=>{let j=rows[row+1].findIndex(t=>t.id===id);if(j<0)return;let t=xy(n.level+1,j,rows[row+1].length);lines.push(`<line x1="${p.x}%" y1="${p.y-22}" x2="${t.x}%" y2="${t.y+22}" class="${pathEdge(n.id,id)?'travelled-edge':n.id===routePreviewId?'chosen-edge':current?'reachable-edge':'future-edge'}"/>`)})
  });
 }

}

 const selected=first.find(n=>n.id===routePreviewId);
 let info=selected?game.routeInfo(selected):null,err=selected?game.nodeReason(selected.id):'没有可用航路';if(s.curses?.lost)err='迷航中：请使用随海流启程';
 return `<section class="map-preview"><h2>归乡航路图</h2><p>沿实线选择下一站。点击地点查看航路；金色连线显示它通向的后续地点。远处藏在迷雾中，到达新地点后再逐步揭示。</p>${renderLongMap()}${selected?`<article class="route-detail"><span class="eyebrow">选择的航路</span><h3>${info.name} → ${esc(selected.name)}</h3><p class="arrival-detail">${esc(info.arrival)}</p><p>${esc(info.clue)}</p><p><b>航路迹象：</b>${esc(info.risk||info.clue)}</p><p><b>可能收获：</b>${esc(info.reward||'暂不可辨')}</p><div class="pills"><span class="pill">至少 ${info.food} 口粮</span><span class="pill">${selected.days} 天航程</span></div><p>${esc(info.sleep)}</p>${selected.days===3?'<p>这段航路要连续应对两处险境，中间没有睡眠；中途不能靠岸。</p>':'<p>途中不能改路或自由靠岸；若绕行或撤退，可能多花时间与口粮。</p>'}<p class="subline">${selected.next.length?'经过此处后，只能沿上图相连的航路继续。':'通过此处后抵达故乡。'}</p>${button(err||'启程前往'+esc(selected.name),'route',{id:selected.id},'primary',!!err,err)}</article>${renderFollowingRoutes(selected,visible[1]||[])}`:''}${s.food<game.foodNeed()?`<div class="notice danger"><b>口粮不足</b><p>紧急求生：经过一天，清醒队员 −2 生命，无睡眠；获得队伍一日口粮，每个节点一次，不刷新地图。</p>${button(s.emergencyUsed?'本节点已使用求生':'紧急求生 · 经过一天','emergency',{},'',s.emergencyUsed)}${s.emergencyUsed?button('结束本次远征 · 补给耗尽','endExpedition'):''}</div>`:''}</section>`;
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-inspect-route]');if(!b||b.disabled)return;routePreviewId=b.dataset.inspectRoute;render()});

renderWorld=function(){let s=game.s,p=s.phase,n=game.currentNode();$('#actions').innerHTML='';$('#scene').innerHTML=scenic(p==='city'?'▥ 城邦港口':p==='island'?'△ 陆地营地':p==='event'?EVENTS[s.event.id].name:'≈ 爱琴海');let titles={map:'规划下一站',voyage:'航程已承诺',scout:'察觉成功 · 遭遇抉择',encounter:'突发遭遇 · 准备迎战',event:'旅途抉择',island:'陆地营地 · 停留也是选择',city:'城邦 · 团队补给',reward:'旅途馈赠 · 三选一',home:'终于归乡',failed:'远征结束',aftermath:'战后救治 · 撤退待结算',testEnd:'开发场景结束',chainRest:'连战测试 · 海上过夜'};$('#heading').innerHTML=`<div class="eyebrow">随机远征 / 已完成 ${s.layer} / 9 层 · 第 ${s.day} 天</div><h1>${titles[p]||p}</h1><p>${esc(s.notice)}</p>`;let html='';
 if(p==='map')html=renderRoutes();
 if(p==='voyage')html=`<h2>${n.name}</h2><p>已完成 ${s.route.day}/${n.days} 日。${s.route.retry?'撤退后再次通过将重检；已支付的原航程不重复扣费。':'途中不能靠岸或改线。'}</p><p>${n.sleep.length?'第 '+n.sleep.join('、')+' 日海上睡眠，只恢复生命与特殊武器充能。':'没有途中睡眠。'}</p>${button(s.route.retry?'重新尝试通过':'继续航行','advance',{},'primary')}`;
 if(p==='encounter')html=`<article class="encounter-story"><span class="eyebrow">航行 → 遭遇 → 战斗</span><h2>${n?.type==='boss'?'归乡海峡的阻拦':'危险突然现身'}</h2><p>${esc(s.notice)}</p><p>即将进入${s.pendingEncounter.sea?'海':'陆'}战：每人 3 点行动。此时无法再绕行或组织偷袭。${s.pendingEncounter.closeAmbush?'海敌将从距离 0 接敌：持弓有贴身劣势，操船后撤可能受到借机攻击。':''}</p>${button('准备好了 · 进入战斗','beginEncounter',{},'primary')}</article>`;
 if(p==='scout'){let es=s.pendingEncounter.enemies;html=`<article class="encounter-story"><span class="eyebrow">航行 → 察觉成功 → 应对危险</span><p>${esc(s.notice)}</p></article><p>现身的威胁：${es.map(e=>e.name+'（'+e.max+' 生命，防护 '+e.ac+'）').join('、')}</p><p>偷袭由当前角色执行：d6 +${game.actor().id===1?2:0} −疲劳 ${game.actor().fatigue} ≥5；成功先行动 2 点。绕行：d6 +${game.alive(s.party[2])?3-s.party[2].fatigue:1} ≥6，成功无战利品，失败正常接战。</p><div class="stack">${button('尝试绕开','scout',{choice:'bypass'})}${button('组织偷袭','scout',{choice:'ambush'},'primary',!game.alive(game.actor()))}${button('直接迎战','scout',{choice:'fight'})}</div>`}
 if(p==='event'){let event=EVENTS[s.event.id];html=`<article class="encounter-story"><span class="eyebrow">${s.event.incident?'航行 → 途中异状 → 应对事件':'航行 → 抵达 → 探索事件'}</span><h2>${event.name}</h2><p>${esc(event.intro)}</p></article><p>执行者：${game.actor().name}。航海专长：老水手 +2；采集专长：猎人 +2，其他人 +0，均减自身疲劳。左侧可切换执行者。</p>${s.event.id==='ruins'?'<p>遗迹敌群：'+n.enemies.map(e=>e.name+' · 生命 '+e.max+'／防护 '+e.ac).join('、')+'</p>':''}<div class="event-options">${event.choices.map(([choice,label])=>{let err=game.eventReason(choice);return button(esc(event.options?game.eventLabel(event.options.find(o=>o.id===choice)):s.event.id==='shrine'&&choice==='repair'?label.replace('3 银币',Math.max(1,3-game.op('cleanseDiscount'))+' 银币'):label)+(err?'<small>'+err+'</small>':''),'event',{choice,hero:s.selected},'',!!err,err)}).join('')}</div>`}
 if(p==='reward')html=`<p>任选一份。团队物品与补给立即生效，秘籍、神赐和装备进入左侧背包，稍后选择角色分配。未选中的以后仍可能出现。</p><div class="route-grid">${s.reward.choices.map(k=>`<article class="route-card">${itemCard(k)}${button('领取并暂存／生效','reward',{item:k},'primary')}</article>`).join('')}</div>`;
 if(p==='island'){let threshold=Math.min(s.island.stays+1,4);html=`<p>剩余采集点 ${s.island.gathers}/2；每日 ${game.foodNeed()} 口粮。当前采集者 ${game.actor().name}：d6 +${game.actor().id===1?2:0} −疲劳 ${game.actor().fatigue} ≥6，成功 +${6+game.op('gather')} 口粮，失败 0。每次采集或扎营均额外 1 日。</p><p>下一次危险：d6 ≤${threshold} 遇敌；指定守夜者使阈值 −1（自身不恢复，连续守夜累积疲劳）。遇敌打断睡眠；此地首次营地胜利掉落小型战利品，后续不重复领取。</p><label>守夜者 <select id="guard"><option value="-1">无人守夜</option>${s.party.filter(h=>game.alive(h)).map(h=>`<option value="${h.id}">${h.name}</option>`).join('')}</select></label><div class="stack">${button('采集一天','gather',{hero:s.selected},'',s.island.gathers<=0||!game.alive(game.actor()))}<button id="campButton">扎营一天 · 恢复战技</button></div>`+renderRoutes()}
 if(p==='city'){html=`<h2>团队市场与旅馆</h2><div class="route-grid">${[['food','口粮',3,2,s.city.food],['bandage','绷带',1,3,s.city.bandages],['revive','复苏药',1,6,s.city.revives]].map(([key,name,count,base,stock])=>`<article class="route-card"><h3>${name} ×${count}</h3><p>库存 ${stock} · ${game.price(base)} 银币</p>${button('团队购买','buy',{item:key},'',s.gold<game.price(base)||stock<count)}</article>`).join('')}</div><p>全队住宿：3 银币＋${game.foodNeed()} 口粮，额外 1 日；清醒队员 +2 生命、战技补满，安全无守夜。缺粮无法恢复。</p>${button('全队旅馆休息一天','lodge',{},'primary',s.gold<3)}<h2>本港商品 · 库存不会刷新</h2><div class="route-grid">${s.city.goods.map((g,index)=>{let cost=game.price(RARITY[ITEMS[g.key].rarity].price),owned=GROWTH[g.key]&&s.collected.includes(g.key);return `<article class="route-card">${itemCard(g.key)}${button(g.sold?'已售出':owned?'本局已拥有':'购买 · '+cost+' 银币','buy',{index},'',g.sold||owned||s.gold<cost)}</article>`}).join('')}</div><h2>补员与装备交易</h2><p>每座城邦可补员一次：8 银币；仅填补永久死亡的非主角空位。新人没有死者神赐或招式。</p><div class="stack">${s.party.filter(h=>h.id!==0).map(h=>button('招募替补 · '+h.name,'recruit',{hero:h.id},'',!h.dead||s.city.recruited||s.gold<8)).join('')}${button('出售当前角色饰品 · +2 银币','sell',{},'',!game.actor().trinket)}</div>`+renderRoutes()}
 if(p==='aftermath')html=`<p>倒地队员已带回。可先使用复苏药；继续后经过 1 日，口粮和救治期限同时结算。</p>${button('完成撤退结算 · 额外一天','continueRetreat',{},'primary')}`;
 if(p==='chainRest')html=button('海上过夜并进入第二场','chain',{},'primary');
 if(['home','failed','testEnd'].includes(p))html=`<div class="notice"><p>历时 ${s.day} 日，获得 ${s.collected.length} 项成长，${s.party.filter(h=>!h.dead).length} 人存活。</p><p>试玩反馈：掉落是否改变打法？经营是否改变路线？不同局是否让你想再来一次？</p><button id="finishExport">导出本局记录</button><button id="cityRestart">新旅程</button></div>`;
 let curse=s.curses||{},cursePanel=curse.fog||curse.lost?`<article class="notice danger"><b>海神干预</b><p>${curse.fog?'前方地点遮蔽：剩余 '+curse.fog+' 次启程。':''}${curse.lost?'下一处分岔由海流随机选择；只抽取相连且口粮足够的航路。':''}</p>${curse.lost&&['map','city','island'].includes(p)?button('随海流启程 · 随机相连航路','drift',{},'primary',!s.map[s.layer]?.some(n=>!game.nodeReason(n.id))):''}${p==='city'||p==='map'&&n?.type==='temple'?button('净化诅咒 · '+Math.max(1,4-game.op('cleanseDiscount'))+' 银币','cleanse',{},'',s.gold<Math.max(1,4-game.op('cleanseDiscount'))):''}</article>`:'';
 $('#choices').innerHTML=recoveryPanel()+renderVictorySummary()+cursePanel+html;
};
const renderBeforeInventory=render;
render=function(){const previous=document.querySelector('#choices .long-map-scroll'),offset=previous?.scrollTop,key=game.s.seed+'-'+game.s.layer+'-'+game.s.phase;renderBeforeInventory();renderInventory();const next=document.querySelector('#choices .long-map-scroll');if(next){if(render.mapKey===key&&offset!==undefined)next.scrollTop=offset;else focusLongMap(document.querySelector('#choices'));}render.mapKey=key};
$('#legacyExport').onclick=async()=>{let raw=localStorage.getItem('ithaca-expedition-v4')||localStorage.getItem('ithaca-expedition-v3')||localStorage.getItem('ithaca-save');if(!raw)return toast('没有旧版存档，新版保存使用独立位置。');try{toast(await RecordExport.save(JSON.stringify({format:'legacy-save',state:JSON.parse(raw)},null,2)))}catch(e){toast(e.message)}};
$('#routeMap').onclick=openRouteMap;
$('#closeRouteMap').onclick=()=>$('#routeMapDialog').close();
$('#mapCurrent').onclick=()=>focusLongMap($('#routeMapDialog'));
$('#recruitTest').onclick=()=>newGame('recruitTest');
render();
